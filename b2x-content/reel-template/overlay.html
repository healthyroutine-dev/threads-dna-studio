<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Pretendard-Medium.woff2);font-weight:500}
@font-face{font-family:P;src:url(Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(Pretendard-ExtraBold.woff2);font-weight:800}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:transparent;color:#fff;font-family:P,sans-serif;overflow:hidden}
.head{position:absolute;left:0;right:0;top:0;height:575px;padding:100px 48px 0;background:#0D0D0D}
.top{display:flex;align-items:center;gap:16px}
.brand{font-weight:800;font-size:34px;letter-spacing:2px;background:#fff;color:#0D0D0F;border-radius:10px;padding:4px 14px}
.series{font-weight:800;font-size:60px;letter-spacing:-.5px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.series b{color:#FF4F8B;margin-left:10px}
.meta{margin-top:12px;font-weight:500;font-size:32px;color:#D2D2D8}
.chips{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px}
.chip{display:flex;align-items:baseline;gap:10px;border:3px solid rgba(255,255,255,.3);border-radius:14px;padding:8px 18px;color:rgba(255,255,255,.55);background:#1A1A1E}
.chip i{font-style:normal;font-weight:800;font-size:24px;letter-spacing:1px}
.chip span{font-weight:800;font-size:32px;white-space:nowrap;letter-spacing:-.3px}
.chip.on{border-color:#FF4F8B;background:#FF4F8B;color:#fff}
.chip.on i{color:#FFE3EC}
.tr{margin-top:22px;border-left:6px solid #FF4F8B;padding:2px 0 2px 16px}
.tr small{display:block;font-weight:800;font-size:22px;letter-spacing:1.5px;color:#FF9DBE}
.tr p{font-weight:700;font-size:34px;line-height:1.3}
.dim{position:absolute;left:0;right:0;top:575px;bottom:0;background:transparent}
.card{position:absolute;left:48px;right:48px;top:600px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.card .n{display:none}
.card h2{font-weight:800;font-size:40px;line-height:1.15;letter-spacing:-.5px}
.card h2 span{background:#FF4F8B;color:#fff;padding:4px 14px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card .l1{display:none;font-weight:700;font-size:34px;line-height:1.5;max-width:900px}
.card .l1 span{background:rgba(0,0,0,.72);padding:3px 12px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card .l2{display:none}
.cta{display:none!important}
</style></head><body>
<div class="dim" id="dim" style="display:none"></div>
<div class="head">
 <div class="top"><span class="brand">B2X</span><span class="series">K-Beauty que vende<b>001/100</b></span></div>
 <p class="meta">@kbeautywithelizabeth · 5,36 M de vistas · 57× sus seguidores</p>
 <div class="chips" id="chips"></div>
 <div class="tr"><small>TEXTO ORIGINAL · TRADUCCIÓN</small><p id="tr"></p></div>
</div>
<div class="card" id="card" style="display:none"><p class="n" id="n"></p><h2 id="h"></h2><p class="l1" id="l1"></p><p class="l2" id="l2"></p><div class="cta" id="cta" style="display:none"></div></div>
<script>
const L=["PROBLEMA","3 PALABRAS","30 DÍAS","SIN FILTRO","MISMO ÁNGULO"];
const TR={before:"Sin filtro · Antes del skincare coreano<br>Rojez, melasma, arrugas",after:"Sin filtro · 30 días después del skincare coreano"};
function render(s){
 chips.innerHTML=L.map((l,i)=>`<div class="chip ${s.lit.includes(i+1)?'on':''}"><i>0${i+1}</i><span>${l}</span></div>`).join('');
 tr.innerHTML=TR[s.tr];
 if(s.card){dim.style.display='block';card.style.display='block';n.textContent=s.card.n;h.innerHTML='<span></span>';h.firstChild.textContent=(s.card.n&&/^\d+$/.test(s.card.n)?s.card.n+' · ':'')+s.card.h;l1.innerHTML='<span></span>';l1.firstChild.textContent=s.card.l1;l2.textContent=s.card.l2;
  if(s.card.cta){cta.style.display='block';cta.textContent=s.card.cta}}
}
</script></body></html>
