<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Pretendard-Medium.woff2);font-weight:500}
@font-face{font-family:P;src:url(Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(Pretendard-ExtraBold.woff2);font-weight:800}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:transparent;color:#fff;font-family:P,sans-serif;overflow:hidden}
.head{position:absolute;left:0;right:0;top:0;height:640px;padding:110px 52px 0;background:linear-gradient(rgba(0,0,0,.82) 0%,rgba(0,0,0,.72) 55%,rgba(0,0,0,0) 100%)}
.top{display:flex;align-items:center;gap:16px}
.brand{font-weight:800;font-size:26px;letter-spacing:2px;background:#fff;color:#0D0D0F;border-radius:8px;padding:4px 12px}
.series{font-weight:800;font-size:46px;letter-spacing:-.5px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.series b{color:#FF4F8B;margin-left:10px}
.meta{margin-top:10px;font-weight:500;font-size:25px;color:#D2D2D8}
.chips{margin-top:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.chip{border:2px solid rgba(255,255,255,.28);border-radius:12px;padding:8px 10px;color:rgba(255,255,255,.6);background:rgba(20,20,24,.55)}
.chip i{display:block;font-style:normal;font-weight:800;font-size:17px;letter-spacing:1px}
.chip span{display:block;font-weight:800;font-size:21px;margin-top:2px;white-space:nowrap;letter-spacing:-.3px}
.chip.on{border-color:#FF4F8B;background:#FF4F8B;color:#fff}
.chip.on i{color:#FFE3EC}
.tr{margin-top:22px;border-left:5px solid #FF4F8B;padding:2px 0 2px 14px}
.tr small{display:block;font-weight:800;font-size:17px;letter-spacing:1.5px;color:#FF9DBE}
.tr p{font-weight:700;font-size:29px;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.card{position:absolute;left:60px;right:60px;top:760px;background:rgba(13,13,15,.92);border:3px solid #FF4F8B;border-radius:28px;padding:44px 46px 48px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card .n{font-weight:800;font-size:30px;color:#FF4F8B;letter-spacing:2px}
.card h2{font-weight:800;font-size:66px;line-height:1.05;margin-top:6px;letter-spacing:-1px}
.card .l1{font-weight:800;font-size:44px;line-height:1.25;margin-top:26px;letter-spacing:-.5px}
.card .l2{font-weight:500;font-size:36px;line-height:1.35;margin-top:16px;color:#D8D8DE}
.cta{margin-top:32px;background:#FF4F8B;border-radius:16px;padding:20px 24px;font-weight:800;font-size:36px;line-height:1.25;text-align:center}
</style></head><body>
<div class="dim" id="dim" style="display:none"></div>
<div class="head">
 <div class="top"><span class="brand">B2X</span><span class="series">K-Beauty que vende<b>001/100</b></span></div>
 <p class="meta">@kbeautywithelizabeth · 5,36 M de vistas · 57× sus seguidores</p>
 <div class="chips" id="chips"></div>
 <div class="tr"><small>TEXTO ORIGINAL · TRADUCCIÓN</small><p id="tr"></p></div>
</div>
<div class="card" id="card" style="display:none"><p class="n" id="n"></p><h2 id="h"></h2><p class="l1" id="l1"></p><p class="l2" id="l2"></p><div class="cta" id="cta" style="display:none"></div></div>
<script>
const L=["PROBLEMA","3 PALABRAS","30 DÍAS","SIN FILTRO","MISMO ÁNGULO"];
const TR={before:"Sin filtro · Antes del skincare coreano<br>Rojez, melasma, arrugas",after:"Sin filtro · 30 días después del skincare coreano"};
function render(s){
 chips.innerHTML=L.map((l,i)=>`<div class="chip ${s.lit.includes(i+1)?'on':''}"><i>0${i+1}</i><span>${l}</span></div>`).join('');
 tr.innerHTML=TR[s.tr];
 if(s.card){dim.style.display='block';card.style.display='block';n.textContent=s.card.n;h.textContent=s.card.h;l1.textContent=s.card.l1;l2.textContent=s.card.l2;
  if(s.card.cta){cta.style.display='block';cta.textContent=s.card.cta}}
}
</script></body></html>
