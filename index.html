<title>Rework Studio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#0e0e10;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;text-align:center;padding:24px}
h1{font-size:clamp(40px,9vw,88px);font-weight:800;letter-spacing:-0.03em}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;margin-right:8px;animation:b 1.6s infinite}

<main>
