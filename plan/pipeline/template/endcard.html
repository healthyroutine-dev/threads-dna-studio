<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Pretendard-ExtraBold.woff2);font-weight:800}
@font-face{font-family:NS;src:url(NotoSans-VF.woff2);font-weight:100 900}
:root{--bg:#09090B;--ink:#fff;--quiet:#AEB4BF;--point:#FD780F}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;background:var(--bg);color:var(--ink);font-family:P,sans-serif;overflow:hidden}
/* v7 엔딩 카드 (2026-11-01): 대표 얼굴 없음 · 위에서부터 🎁 자료명 → 👇 댓글 → B2X → 상호명. 인스타 하단 캡션(1560 아래)·오른쪽 버튼(x940 오른쪽) 피함 */
.gift{position:absolute;left:0;right:0;top:390px;display:flex;flex-direction:column;align-items:center}
.gift .ic{width:244px;height:244px;background:url(ring220.png) center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-family:"Noto Color Emoji";font-size:112px}
.gift h1{margin-top:34px;max-width:900px;text-align:center;font-weight:800;font-size:76px;line-height:1.08;letter-spacing:-1px;text-wrap:balance}
.gift h1::after{content:"";display:block;width:120px;height:10px;border-radius:5px;background:var(--point);margin:26px auto 0}
.cmt{position:absolute;left:60px;right:60px;top:1080px;text-align:center;font-weight:800;font-size:58px;line-height:1.15;white-space:pre-line}
.cmt b{color:var(--point);font-weight:800}
.b2x{position:absolute;left:0;right:0;top:1290px;text-align:center;font-family:NS;color:#fff}.b2x h1{font-weight:700;font-size:58px;letter-spacing:-.5px;line-height:1.05}.b2x p{font-weight:400;font-size:29px;color:var(--quiet);letter-spacing:.5px;margin-top:6px}
</style></head><body>
<div class="gift"><div class="ic">🎁</div><h1 id="gname"></h1></div>
<div class="cmt" id="cmt"></div><!-- 👇 손은 build에서 이 위에 (x470, y905) 위아래로 -->
<div class="b2x"><h1>B2X Buyers Club</h1><p>Powered by TECH2WORLDWIDE</p></div><!-- 상호명 (v6 그대로): 끝에 잠깐 나왔다가 사라짐 -->
<script>function render(s){gname.textContent=s.gift||(s.items||[])[0]||"";cmt.innerHTML=s.cmt||"¡Déjame <b>cualquier emoji</b>\nen los comentarios!"}</script>
</body></html>
